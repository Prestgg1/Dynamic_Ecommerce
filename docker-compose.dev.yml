# docker-compose.dev.yml
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENABLE_SWAGGER: "true"
      DB_LOGGING: "true"
    volumes:
      - ./backend:/app # ← Kod dəyişiklikləri anında görünür
      - /app/node_modules # ← node_modules-u override etmə
      - backend_uploads:/app/uploads
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev # ← Ayrı dev Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app # ← Kod dəyişiklikləri anında görünür
    ports:
      - "5173:5173"

volumes:
  mysql_data:
  backend_uploads:
